<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IMM Dashboard</title>
<style>
  :root{
    /* One knob for every font size on the page. 1 = original, 0.8 = 20% smaller. */
    --fs:0.8;
    --row-odd:#F4F5F6; --row-even:#EAECEE; --ink:#2B2B2B;
    --title:#B08D3F; --sel-row:#FFF8E8; --sel-border:#2E5AAC;
    --check:#3D8B3D; --muted:#6B7078; --total-bg:#B0392E;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:#fff;color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    font-weight:400;line-height:1.4;
    font-size:calc(13px * var(--fs));
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:1400px;margin:0 auto;padding:28px 40px 56px}

  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:22px}
  h1{margin:0;font-size:calc(32px * var(--fs));font-weight:700;letter-spacing:-.2px;color:var(--title)}
  .pickers{display:flex;gap:12px;flex:0 0 auto}
  .picker-sm{min-width:118px}
  .picker{border:1px solid #C9CCD1;border-radius:6px;background:#fff;padding:6px 12px 7px;min-width:190px;position:relative}
  .picker label{display:block;font-size:calc(11px * var(--fs));color:var(--muted);margin-bottom:1px}
  .picker select{-webkit-appearance:none;appearance:none;border:0;background:transparent;font:inherit;font-size:calc(15px * var(--fs));color:var(--ink);width:100%;padding:0 20px 0 0;cursor:pointer;outline:none}
  .picker::after{content:"";position:absolute;right:12px;bottom:15px;pointer-events:none;width:9px;height:9px;border-right:1.6px solid #6E737A;border-bottom:1.6px solid #6E737A;transform:rotate(45deg)}
  .picker:focus-within{border-color:var(--sel-border);box-shadow:0 0 0 2px rgba(46,90,172,.15)}

  /* Custom dropdown. A native <select> popup is drawn by the OS and ignores
     padding, so the real <select> is kept (hidden) as the source of truth and
     this list is rendered over it. */
  .picker.custom select{display:none}
  .cs-btn{display:block;width:100%;text-align:left;border:0;background:transparent;
          font:inherit;font-size:calc(15px * var(--fs));color:var(--ink);padding:0 20px 0 0;cursor:pointer;outline:none}
  .cs-list{position:absolute;top:calc(100% + 5px);left:-1px;right:-1px;z-index:30;
           margin:0;padding:6px 0;list-style:none;background:#fff;border:1px solid #C9CCD1;
           border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.13);max-height:340px;overflow-y:auto}
  .cs-list[hidden]{display:none}
  .cs-opt{padding:9px 16px;font-size:calc(14px * var(--fs));line-height:1.35;color:var(--ink);cursor:pointer;
          white-space:nowrap}
  .cs-opt:hover,.cs-opt.active{background:#F1F2F4}
  .cs-opt[aria-selected="true"]{font-weight:700;color:var(--sel-border)}

  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;table-layout:fixed}
  /* During measurement the browser sizes the columns itself; widths are then
     read back and pinned so table-layout:fixed can take over. */
  table.measuring{table-layout:auto}
  thead th{color:#fff;font-weight:700;font-size:calc(11.5px * var(--fs) * 1.1);line-height:1.25;height:56px;vertical-align:middle;padding:4px 10px;text-align:center}
  thead th.a-left{text-align:left;padding-left:22px}

  tbody td{height:25px;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  tbody td.f-text, tbody td.wrap{white-space:normal;overflow:visible;text-overflow:clip;
                overflow-wrap:anywhere;line-height:1.3;padding-top:5px;padding-bottom:5px}
  tbody tr:nth-child(odd) td{background:var(--row-odd)}
  tbody tr:nth-child(even) td{background:var(--row-even)}
  td.a-right,tfoot td.a-right{text-align:right;font-variant-numeric:tabular-nums}
  td.a-left,tfoot td.a-left{text-align:left;padding-left:22px}
  td.a-center{text-align:center}
  td.f-tick{color:var(--check)}
  /* Body cells only — the Total row keeps its own white, larger type. */
  tbody td.f-text.a-right{font-size:calc(11px * var(--fs));color:#4A4F56;padding-right:22px}
  tfoot td.f-text.a-right{padding-right:22px}
  td.edge-r,tfoot td.edge-r{padding-right:22px}
  td.clickable{cursor:pointer}

  tbody tr.sel td{background:var(--sel-row);font-weight:700}
  td.cell-sel{outline:2px solid var(--sel-border);outline-offset:-3px;border-radius:3px;font-weight:700}

  tfoot td{background:var(--total-bg);color:#fff;font-weight:700;font-size:calc(13px * var(--fs) * 1.1);height:30px;padding:0 10px;white-space:nowrap}

  thead th.sortable{cursor:pointer;-webkit-user-select:none;user-select:none}
  thead th.sortable:hover{filter:brightness(1.07)}
  thead th .arrow{font-size:calc(9px * var(--fs));margin-left:4px;opacity:.95;white-space:nowrap}
  thead th .arrow .idx{font-size:calc(8px * var(--fs));vertical-align:2px;margin-right:1px}
  thead th.sorted{font-weight:700}
  thead th{position:relative}
  .grip{position:absolute;top:0;right:0;bottom:0;width:9px;cursor:col-resize;
        z-index:2;touch-action:none}
  .grip::after{content:"";position:absolute;top:22%;bottom:22%;right:4px;width:1px;
               background:rgba(255,255,255,.45)}
  .grip:hover::after,.grip.dragging::after{background:#fff;width:2px;right:3px}
  body.resizing{cursor:col-resize;-webkit-user-select:none;user-select:none}
  .hint a{color:var(--sel-border);cursor:pointer;text-decoration:underline}

  .pager{display:flex;align-items:center;justify-content:space-between;gap:16px;
         margin-top:12px;font-size:calc(12px * var(--fs));color:var(--muted)}
  .pager .btns{display:flex;gap:4px}
  .pager button{font:inherit;color:var(--ink);background:#fff;border:1px solid #C9CCD1;
                border-radius:4px;min-width:28px;height:26px;padding:0 8px;cursor:pointer}
  .pager button:hover:not(:disabled){border-color:var(--sel-border);color:var(--sel-border)}
  .pager button:disabled{opacity:.4;cursor:default}
  .pager button.cur{background:var(--sel-border);border-color:var(--sel-border);color:#fff;font-weight:700}
  .pager .gap{padding:0 2px;color:var(--muted)}
  .pager .left{display:flex;align-items:center;gap:10px}
  .pager .rpp{display:flex;align-items:center;gap:6px}
  .pager .rpp select{font:inherit;color:var(--ink);background:#fff;border:1px solid #C9CCD1;
                     border-radius:4px;height:26px;padding:0 6px;cursor:pointer}
  .pager .rpp select:focus{outline:none;border-color:var(--sel-border);box-shadow:0 0 0 2px rgba(46,90,172,.15)}
  .hint{margin-top:6px;font-size:calc(11px * var(--fs));color:var(--muted)}
  .pager:empty{display:none}

  .foot{margin-top:14px;font-size:calc(11.5px * var(--fs));color:var(--muted)}
  .foot code{font-size:calc(11px * var(--fs));background:#F1F2F4;padding:1px 5px;border-radius:3px}
  .chip{display:inline-block;width:9px;height:9px;border-radius:2px;margin:0 4px 0 9px;vertical-align:baseline}
  .warn{margin:0 0 16px;padding:9px 14px;border-radius:6px;background:#FDF3E2;border:1px solid #E6C98A;color:#7A5A16;font-size:calc(12px * var(--fs))}
  .warn:empty{display:none}
  .empty{padding:40px 22px;color:var(--muted);background:var(--row-odd)}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <h1 id="title">—</h1>
    <div class="pickers">
      <div class="picker"><label for="grp">Team</label><select id="grp"></select></div>
      <div class="picker"><label for="mth">Report Month</label><select id="mth"></select></div>
    </div>
  </div>

  <div class="warn" id="warn"></div>

  <div class="scroll">
    <table>
      <colgroup id="cg"></colgroup>
      <thead><tr id="thr"></tr></thead>
      <tbody id="tbody"></tbody>
      <tfoot id="tfoot"></tfoot>
    </table>
  </div>

  <div class="pager" id="pager"></div>
  <p class="hint" id="hint"></p>

  <p class="foot" id="foot"></p>
</div>

<script>
(function(){
  var D = null;   // built at load time by reading the workbook
  var $ = function(id){ return document.getElementById(id); };
  var isArr = function(x){ return Object.prototype.toString.call(x) === "[object Array]"; };

  // Used only when config/settings.json cannot be fetched (e.g. opened over file://).
  var FALLBACK = {
    dataset: {reportDateColumn:"report_date", groupColumn:"exco_view1_level1",
              idColumn:"mandate_id", weightColumn:"aum_usd"},
    analytics: {
      base: {label:"Portfolio",   colour:"#B0A99F"},
      perf: {label:"Performance", colour:"#B0392E"},
      risk: {label:"Risk",        colour:"#B39140"},
      esg:  {label:"ESG",         colour:"#9A9AC2"},
      kpi:  {label:"KPI",         colour:"#7D9B87"}
    },
    columns: [
      {column:"port_mandate_name",         analytics:"base", header:"Portfolio",                format:"text"},
      {column:"aum_usd",                   analytics:"base", header:"Gross AUM|(USD 'm)",       format:"musd"},
      {column:"excess_rtn_ytd",            analytics:"perf", header:"Excess|Return|(YTD)",      format:"pct1"},
      {column:"port_rtn_ytd",              analytics:"perf", header:"Portfolio|Return|(YTD)",   format:"pct1"},
      {column:"excess_rtn_3y_ann",         analytics:"perf", header:"Excess|Return (3Y)",       format:"pct1"},
      {column:"port_rtn_3y_ann",           analytics:"perf", header:"Portfolio|Return (3Y)",    format:"pct1"},
      {column:"port_total_risk",           analytics:"risk", header:"Active|Total Risk",        format:"pct1"},
      {column:"relative_var_para",         analytics:"risk", header:"Relative|VaR (Para)",      format:"num2"},
      {column:"port_msci_carbon_emission", analytics:"esg",  header:"Port|WACI",                format:"int"},
      {column:"bmk_msci_carbon_emission",  analytics:"esg",  header:"Bmk|WACI",                 format:"int"},
      {column:"kpi_in_scope",              analytics:"kpi",  header:"KPI In|Scope",             format:"tick"},
      {column:"reason",                    analytics:"kpi",  header:"Reason for|KPI Exclusion", format:"text",
       showWhen:{kpi_in_scope:0}}
    ],
    groups: null
  };

  // Everything that means "no value". A blank cell already arrives as null, but
  // a workbook can also carry an empty string (a formula returning "") and the
  // sentinels people type by hand. All of them must be missing everywhere --
  // formatted, aggregated and sorted -- or an empty string silently weighs into
  // a weighted average as a zero. Excel's own error cells are mapped to null by
  // the reader; the codes are listed anyway in case one arrives as text.
  var MISSING = {
    "": 1, "-": 1, "--": 1, ".": 1, "?": 1, "na": 1, "n/a": 1, "n.a.": 1,
    "nil": 1, "none": 1, "null": 1, "nan": 1, "#n/a": 1, "#value!": 1,
    "#div/0!": 1, "#ref!": 1, "#name?": 1, "#num!": 1, "#null!": 1
  };
  function missing(v){
    if (v == null) return true;
    if (typeof v === "number") return !isFinite(v);
    return MISSING[String(v).trim().toLowerCase()] === 1;
  }
  // A finite number, or null. Text is parsed only if it is wholly numeric, so
  // "1.5" counts and "1.5x" does not -- guessing at half-numeric text would be
  // worse than dropping it, because the reader cannot ask what was meant.
  function num(v){
    if (missing(v)) return null;
    var n = typeof v === "number" ? v : Number(String(v).trim());
    return typeof n === "number" && isFinite(n) ? n : null;
  }
  // Formats whose values are numbers, and so must sort and aggregate as numbers.
  var NUMERIC_FMT = {musd: 1, pct1: 1, num2: 1, int: 1, tick: 1};

  var FMT = {
    text: function(v){ return v == null ? "" : String(v); },
    musd: function(v){ v = num(v); return v == null ? "" : Math.round(v/1e6).toLocaleString("en-US") + "M"; },
    pct1: function(v){ v = num(v); return v == null ? "" : (v*100).toFixed(1) + "%"; },
    num2: function(v){ v = num(v); return v == null ? "" : v.toFixed(2); },
    int:  function(v){ v = num(v); return v == null ? "" : Math.round(v).toLocaleString("en-US"); },
    tick: function(v){ return num(v) === 1 ? "✓" : ""; }
  };
  // Per-format defaults, so a column entry only needs column/analytics/header/format.
  // Per-format defaults for alignment and Total behaviour. Widths are not
  // listed: the browser measures every column against what is on screen.
  // `total:"agg"` means "use table.aggregation" (avg or wavg).
  var DEF = {
    text: {align:"right",  total:"none"},
    musd: {align:"right",  total:"sum"},
    pct1: {align:"right",  total:"agg"},
    num2: {align:"right",  total:"agg"},
    int:  {align:"right",  total:"agg"},
    tick: {align:"center", total:"none"}
  };
  var PAGE_OPTS = [5, 10, 25, 50, 100, "all"];

  var cfg, DS, TBL, groups, cols, baseWarn = [], warn = [], sel = null;
  var BANDS = {};   // column -> ordered band table, from a mapping workbook
  var sortKeys = [], page = 1, pageSize = 10, LABEL_ROWS = "Rows per page";

  // Widths the user has dragged, in px, keyed by workbook column. Kept across
  // team switches and reloads; measurement takes over again once cleared.
  var WKEY = "imm-dashboard.columnWidths", manual = {};
  try { manual = JSON.parse(localStorage.getItem(WKEY) || "{}") || {}; } catch (e) { manual = {}; }
  function saveWidths(){
    try {
      if (Object.keys(manual).length) localStorage.setItem(WKEY, JSON.stringify(manual));
      else localStorage.removeItem(WKEY);
    } catch (e) {}
  }   // sortKeys: [{col, dir}] in priority order

  // Off-screen text measurement — used only to size the pickers, which are not
  // table cells and so cannot be measured by the table layout itself.
  var _mcanvas;
  function fontOf(el, weight){
    var cs = getComputedStyle(el);
    return (weight || cs.fontWeight) + " " + cs.fontSize + " " + cs.fontFamily;
  }
  function measureText(text, font){
    _mcanvas = _mcanvas || document.createElement("canvas");
    var ctx = _mcanvas.getContext("2d");
    ctx.font = font;
    return ctx.measureText(String(text == null ? "" : text)).width;
  }

  function norm(x){ return String(x).toLowerCase().replace(/\s+/g, " ").trim(); }
  function def(c, prop){
    if (c[prop] != null) return c[prop];
    return (DEF[c.format] || DEF.text)[prop];
  }

  function vals(rows, key){
    var out = [];
    rows.forEach(function(r){ var x = num(r[key]); if (x != null) out.push(x); });
    return out;
  }
  function mean(rows, key){
    var v = vals(rows, key);
    return v.length ? v.reduce(function(a,b){ return a+b; }, 0) / v.length : null;
  }
  // AUM-weighted mean. Only positive weights count — the dataset permits
  // negative AUM, which would otherwise invert the average. Falls back to a
  // simple mean when no row carries positive weight.
  function wmean(rows, key){
    var acc = 0, den = 0, W = DS.weightColumn;
    rows.forEach(function(r){
      var x = num(r[key]);
      if (x == null) return;                 // no value: carries no weight either
      var w = num(r[W]);
      w = w != null && w > 0 ? w : 0;
      acc += w * x; den += w;
    });
    return den > 0 ? acc / den : mean(rows, key);
  }
  function aggregate(rows, key, how){
    if (how === "agg") how = TBL.aggregation;
    if (how === "sum"){
      // Blank when there was nothing to add, so "no data" cannot masquerade as 0.
      var s = 0, any = false;
      rows.forEach(function(r){ var x = num(r[key]); if (x != null){ s += x; any = true; } });
      return any ? s : null;
    }
    if (how === "avg")  return mean(rows, key);
    if (how === "wavg") return wmean(rows, key);
    return null;
  }

  // Share of weight whose value is one of `share.values` — e.g. the percentage
  // of AUM rated 1 or 2. Rows with no value are ignored entirely, so they sit
  // in neither the numerator nor the denominator.
  function shareAggregate(rows, c){
    var want = {}, spec = c.share || {};
    (spec.values || []).forEach(function(v){ want[String(v)] = 1; });
    if (!Object.keys(want).length){
      warn.push('column "' + c.column + '" uses total:"share" but lists no `share.values`');
      return null;
    }
    var W = DS.weightColumn, hit = 0, tot = 0;
    rows.forEach(function(r){
      var v = r[c.column];
      if (missing(v) || !visible(c, r)) return;   // no rank: ignored entirely
      var w = num(r[W]);
      w = w != null && w > 0 ? w : 0;             // only positive weight counts
      if (!w) return;
      tot += w;
      if (want[String(v)]) hit += w;
    });
    return tot > 0 ? hit / tot : null;
  }

  // Aggregate a coded column (e.g. an ORR grade) through a mapping table:
  // translate each label to its numeric `order`, take the weighted mean of
  // those, then read back which band the result falls into and show that
  // band's label. Labels listed in `exclude` carry no weight at all.
  function bandAggregate(rows, c){
    var tbl = BANDS[c.column];
    if (!tbl) return null;
    var W = DS.weightColumn, acc = 0, den = 0, plain = [];

    rows.forEach(function(r){
      var lab = r[c.column];
      if (missing(lab) || !visible(c, r)) return;
      var e = tbl.byLabel[String(lab)];
      if (!e){ warn.push('ORR grade "' + lab + '" is not in ' + tbl.source); return; }
      if (e.excluded) return;
      plain.push(e.value);
      var w = num(r[W]);
      w = w != null && w > 0 ? w : 0;
      acc += w * e.value; den += w;
    });

    var x;
    if (den > 0) x = acc / den;
    else if (plain.length) x = plain.reduce(function(a, b){ return a + b; }, 0) / plain.length;
    else return null;

    // First band that contains the value, scanning in file order; bands are
    // lower-inclusive because they share endpoints.
    var list = tbl.rows;
    for (var i = 0; i < list.length; i++){
      if (x >= list[i].min && x < list[i].max) return list[i].label;
    }
    var last = list[list.length - 1];
    if (x >= last.max) return last.label;          // the top band includes its max
    return list[0].label;                          // below the scale
  }
  // Recognised sentinels blank out silently -- that is what they are for. Text
  // that is NOT a recognised sentinel is a data problem the reader should see,
  // so it blanks the cell and says so in the banner rather than vanishing.
  function reportJunk(rows){
    cols.forEach(function(c){
      if (!NUMERIC_FMT[c.format]) return;
      var seen = [], n = 0;
      rows.forEach(function(r){
        var v = r[c.column];
        if (missing(v) || num(v) != null) return;
        n++;
        if (seen.length < 3 && seen.indexOf(String(v)) === -1) seen.push(String(v));
      });
      if (n) warn.push(n + ' non-numeric value' + (n === 1 ? "" : "s") + ' in "'
                       + c.column + '" ignored (' + seen.map(function(x){
                         return '"' + x + '"'; }).join(", ") + ')');
    });
  }
  function aggLabel(){
    return TBL.aggregation === "avg" ? "simple averages" : "AUM-weighted averages";
  }

  // Sort on the underlying value, never the formatted string. Blanks sort last
  // in both directions.
  function cmpVal(x, y, dir){
    var xn = (x === null || x === undefined || x === "");
    var yn = (y === null || y === undefined || y === "");
    if (xn || yn) return xn && yn ? 0 : (xn ? 1 : -1);
    if (typeof x === "number" && typeof y === "number") return dir * (x - y);
    return dir * String(x).localeCompare(String(y), undefined, {numeric: true});
  }
  // Keys are applied in priority order: the first that separates two rows wins.
  // Sorts on what the cell DISPLAYS: a value hidden by `showWhen` sorts as
  // blank, so those rows collect at the end instead of being ordered by a
  // value the reader cannot see.
  function sorter(keys){
    var byCol = {};
    cols.forEach(function(c){ byCol[c.column] = c; });
    function shown(r, col){
      var c = byCol[col];
      if (c && !visible(c, r)) return null;
      var v = r[col];
      if (missing(v)) return null;                       // blank on screen, blank to sort
      return c && NUMERIC_FMT[c.format] ? num(v) : v;    // never sort numbers as text
    }
    return function(a, b){
      for (var i = 0; i < keys.length; i++){
        var k = keys[i];
        var r = cmpVal(shown(a, k.col), shown(b, k.col), k.dir);
        if (r) return r;
      }
      return 0;
    };
  }
  function keyIndex(col){
    for (var i = 0; i < sortKeys.length; i++) if (sortKeys[i].col === col) return i;
    return -1;
  }

  function analyticsBlock(){ return cfg.analytics || FALLBACK.analytics; }
  function columnList(){ return cfg.columns || FALLBACK.columns; }

  function columnIndex(){
    var idx = {};
    columnList().forEach(function(c){
      if (c && c.column) idx[norm(c.column)] = c;
    });
    return idx;
  }
  var IDX;

  // table.defaultSort accepts one {column,direction} or an array of them.
  function applyDefaultSort(){
    var d = TBL.defaultSort;
    var list = isArr(d) ? d : (d ? [d] : []);
    sortKeys = [];
    list.forEach(function(k){
      if (!k || !k.column) return;
      if (D.columns.indexOf(k.column) === -1){
        baseWarn.push('table.defaultSort column "' + k.column + '" is not in ' + D.source);
        return;
      }
      sortKeys.push({col: k.column, dir: (k.direction === "asc") ? 1 : -1});
    });
    if (!sortKeys.length) sortKeys = [{col: DS.weightColumn, dir: -1}];
  }

  function normGroups(){
    var raw = cfg.groups, byKey = {};
    D.groups.forEach(function(g){ byKey[g.key] = g; });
    if (!isArr(raw) || !raw.length)
      return D.groups.map(function(g){ return {key:g.key, label:g.label}; });

    var out = [];
    raw.forEach(function(e){
      if (!e || !e.group) return;
      if (!byKey[e.group]){
        baseWarn.push('settings.json: group "' + e.group + '" is not present in ' + D.source);
        return;
      }
      out.push({key: e.group, label: e.name || e.title || byKey[e.group].label,
                pick: e.columns || null, ov: e.analytics || null});
    });
    if (!out.length){
      baseWarn.push("no configured group matched the data — showing all groups");
      return D.groups.map(function(g){ return {key:g.key, label:g.label}; });
    }
    return out;
  }

  // Global analytics block with this group's overrides merged over the top.
  function effAnalytics(ov){
    var base = analyticsBlock(), out = {};
    Object.keys(base).forEach(function(k){
      if (k.charAt(0) === "_") return;
      out[k] = {label: base[k].label || k, show: base[k].show !== false,
                colour: base[k].colour || "#B0A99F"};
    });
    if (!ov) return out;
    Object.keys(ov).forEach(function(k){
      if (k.charAt(0) === "_") return;
      if (!out[k]){ warn.push('unknown analytics group "' + k + '"'); return; }
      var o = ov[k];
      if (typeof o === "boolean"){ out[k].show = o; return; }
      if (o && typeof o === "object"){
        if ("show" in o)  out[k].show   = o.show !== false;
        if (o.colour)     out[k].colour = o.colour;
        if (o.label)      out[k].label  = o.label;
      }
    });
    return out;
  }

  function pickColumns(an, pick){
    var chosen;
    if (isArr(pick) && pick.length){
      // Explicit list wins over analytics show/hide; order follows the list.
      chosen = [];
      pick.forEach(function(nm){
        var c = IDX[norm(nm)];
        if (!c){ warn.push('column "' + nm + '" is not defined in `columns`'); return; }
        if (chosen.indexOf(c) === -1) chosen.push(c);
      });
      if (!chosen.length){
        warn.push("no column in the group list matched — showing the full column list");
        chosen = null;
      }
    }
    if (!chosen){
      chosen = columnList().filter(function(c){
        return c && c.column && (c.analytics === "base" || (an[c.analytics] && an[c.analytics].show));
      });
    }
    return chosen.filter(function(c){
      if (!an[c.analytics]){
        warn.push('column "' + c.column + '" has unknown analytics group "' + c.analytics + '"');
        return false;
      }
      if (D.columns.indexOf(c.column) === -1){
        warn.push('column "' + c.column + '" is not in ' + D.source);
        return false;
      }
      return true;
    });
  }

  // `width: "fit"` sizes a column to its widest value in the current selection.
  // Measured in px, then converted back into the relative-weight system so the
  // remaining columns still share what is left of the table.
  // ---------------------------------------------------------------------
  // Column sizing. Rather than predicting text widths, the table is rendered
  // once with table-layout:auto — the browser sizes every column to the text
  // actually on screen, wrapping the text columns as needed — and the result
  // is read back and pinned. Nothing is estimated: no font guessing, no
  // padding arithmetic, no compression heuristic.
  // ---------------------------------------------------------------------
  var MIN_COL_PX = 34;

  function buildHead(an){
    var cg = $("cg"), thr = $("thr");
    cg.innerHTML = ""; thr.innerHTML = "";
    cols.forEach(function(c, i){
      cg.appendChild(document.createElement("col"));

      var th = document.createElement("th");
      th.style.backgroundColor = an[c.analytics].colour;
      var cl = ["sortable"];
      if (align(c, i) === "left") cl.push("a-left");
      var ki = keyIndex(c.column);
      if (ki !== -1) cl.push("sorted");
      th.className = cl.join(" ");
      th.dataset.col = c.column;
      String(c.header == null ? c.column : c.header).split("|").forEach(function(line, j){
        if (j) th.appendChild(document.createElement("br"));
        th.appendChild(document.createTextNode(line.trim()));
      });
      if (ki !== -1){
        var ar = document.createElement("span");
        ar.className = "arrow";
        if (sortKeys.length > 1){
          var ix = document.createElement("span");
          ix.className = "idx"; ix.textContent = String(ki + 1);
          ar.appendChild(ix);
        }
        ar.appendChild(document.createTextNode(sortKeys[ki].dir === 1 ? "▲" : "▼"));
        th.appendChild(ar);
      }
      if (i < cols.length - 1){
        var grip = document.createElement("div");
        grip.className = "grip";
        grip.title = "Drag to resize · double-click to reset";
        grip.dataset.col = c.column;
        th.appendChild(grip);
      }
      thr.appendChild(th);
    });
  }

  // Called once the body and total rows are in the DOM.
  function sizeColumns(){
    var tableEl = document.querySelector("table");
    var colEls = $("cg").children, ths = $("thr").children;
    if (!ths.length) return;

    // 1. Let the browser lay it out. Auto layout sizes each column between its
    //    min-content and max-content width and shares any slack in proportion,
    //    which is the balanced result we want. Only a column explicitly marked
    //    `flex` overrides that and swallows the slack itself.
    var flexIdx = -1;
    cols.forEach(function(c, i){
      if (c.flex && flexIdx < 0 && !manual[c.column]) flexIdx = i;
    });

    for (var i = 0; i < colEls.length; i++){
      var c = cols[i];
      // A dragged width wins; then an explicit `width` in the config (px);
      // otherwise the browser decides.
      var pinned = manual[c.column] || (typeof c.width === "number" ? c.width : 0);
      colEls[i].style.width = pinned ? pinned + "px"
                            : (i === flexIdx ? "100%" : "");
    }
    tableEl.classList.add("measuring");

    // 2. read back what the browser decided (forces layout)
    var widths = [];
    for (var j = 0; j < ths.length; j++) widths.push(ths[j].getBoundingClientRect().width);

    // 3. pin those widths so table-layout:fixed governs from here — which is
    //    what makes drag-to-resize exact.
    tableEl.classList.remove("measuring");
    var total = widths.reduce(function(a, b){ return a + b; }, 0) || 1;
    for (var k = 0; k < colEls.length; k++){
      colEls[k].style.width = (Math.max(widths[k], MIN_COL_PX) / total * 100).toFixed(3) + "%";
    }
  }

  // Drag a header edge to resize. The width taken is given back to a neighbour,
  // so the table keeps its width and never gains a scrollbar.
  function startResize(e, colName){
    var i = -1;
    cols.forEach(function(c, n){ if (c.column === colName) i = n; });
    if (i < 0 || i >= cols.length - 1) return;
    var give = i + 1;                    // the neighbour that absorbs the change

    var colEls = $("cg").children, cells = $("thr").children;
    var startX = e.clientX;
    var startW = cells[i].getBoundingClientRect().width;
    var startGive = cells[give].getBoundingClientRect().width;
    var grip = e.target;

    grip.classList.add("dragging");
    document.body.classList.add("resizing");

    function clamp(ev){
      var d = ev.clientX - startX;
      return Math.max(MIN_COL_PX - startW, Math.min(d, startGive - MIN_COL_PX));
    }
    function move(ev){
      var d = clamp(ev);
      colEls[i].style.width = (startW + d) + "px";
      colEls[give].style.width = (startGive - d) + "px";
    }
    function up(ev){
      var d = clamp(ev);
      grip.classList.remove("dragging");
      document.body.classList.remove("resizing");
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      if (Math.abs(d) < 2) return;
      manual[cols[i].column] = Math.round(startW + d);
      manual[cols[give].column] = Math.round(startGive - d);
      saveWidths();
      render();
    }
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
    e.preventDefault();
    e.stopPropagation();
  }

  $("thr").addEventListener("mousedown", function(e){
    if (e.target.classList && e.target.classList.contains("grip"))
      startResize(e, e.target.dataset.col);
  });
  $("thr").addEventListener("dblclick", function(e){
    if (!e.target.classList || !e.target.classList.contains("grip")) return;
    delete manual[e.target.dataset.col];
    saveWidths(); render();
    e.preventDefault(); e.stopPropagation();
  });

  function align(c, i){ return c.align || (i === 0 ? "left" : def(c, "align")); }

  function visible(c, r){
    if (!c.showWhen) return true;
    return Object.keys(c.showWhen).every(function(k){ return r[k] === c.showWhen[k]; });
  }

  function cellClass(c, i, body){
    var cl = ["a-" + align(c, i), "f-" + c.format];
    if (i === cols.length - 1 || c.format === "musd") cl.push("edge-r");
    if (body && c.wrap) cl.push("wrap");
    return cl.join(" ");
  }

  function render(){
    var gKey = $("grp").value, m = $("mth").value;
    var entry = groups.filter(function(g){ return g.key === gKey; })[0] || groups[0];

    warn = [];
    var an = effAnalytics(entry.ov);
    cols = pickColumns(an, entry.pick);
    $("title").textContent = entry.label;

    // Drop sort keys whose column this group does not show; if none survive,
    // fall back to the configured default, then to the first visible column.
    var shownCols = {};
    cols.forEach(function(c){ shownCols[c.column] = 1; });
    sortKeys = sortKeys.filter(function(k){ return shownCols[k.col]; });
    if (!sortKeys.length){
      applyDefaultSort();
      sortKeys = sortKeys.filter(function(k){ return shownCols[k.col]; });
      if (!sortKeys.length && cols.length) sortKeys = [{col: cols[0].column, dir: -1}];
    }

    var all = D.rows.filter(function(r){
      return r[DS.groupColumn] === gKey && r[DS.reportDateColumn] === m;
    });
    if (sortKeys.length) all = all.slice().sort(sorter(sortKeys));
    reportJunk(all);

    // Totals always cover the whole selection, never just the visible page.
    var pages = pageSize === "all" ? 1 : Math.max(1, Math.ceil(all.length / pageSize));
    if (page > pages) page = pages;
    var from = pageSize === "all" ? 0 : (page - 1) * pageSize;
    var rows = pageSize === "all" ? all : all.slice(from, from + pageSize);

    buildHead(an);

    var tbody = $("tbody"), tfoot = $("tfoot");
    tbody.innerHTML = ""; tfoot.innerHTML = "";

    if (!all.length){
      var tr0 = document.createElement("tr"), td0 = document.createElement("td");
      td0.className = "empty"; td0.colSpan = Math.max(cols.length, 1);
      td0.textContent = "No mandates for this selection.";
      tr0.appendChild(td0); tbody.appendChild(tr0);
      $("pager").innerHTML = "";
    } else {
      rows.forEach(function(r){
        var id = r[DS.idColumn];
        var tr = document.createElement("tr");
        if (sel && sel.id === id) tr.className = "sel";
        cols.forEach(function(c, i){
          var td = document.createElement("td");
          td.className = cellClass(c, i, true);
          td.textContent = visible(c, r) ? (FMT[c.format] || FMT.text)(r[c.column]) : "";
          if (def(c, "total") !== "none"){
            td.classList.add("clickable");
            td.dataset.id = id; td.dataset.k = c.column;
            if (sel && sel.id === id && sel.k === c.column) td.classList.add("cell-sel");
          }
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      var t = document.createElement("tr"), labelled = false;
      cols.forEach(function(c, i){
        var td = document.createElement("td"), v = "", how = def(c, "total");
        if (how === "band")      v = FMT.text(bandAggregate(all, c));
        else if (how === "share"){
          var sf = FMT[(c.share || {}).format] || FMT.pct1;
          v = sf(shareAggregate(all, c));
        }
        else if (how !== "none") v = (FMT[c.format] || FMT.text)(aggregate(all, c.column, how));
        else if (!labelled)    { v = "Total"; labelled = true; }
        td.className = cellClass(c, i);
        td.textContent = v;
        t.appendChild(td);
      });
      tfoot.appendChild(t);
    }

    var live = {};
    cols.forEach(function(c){ live[c.analytics] = 1; });
    var chips = Object.keys(an).filter(function(k){ return k !== "base" && live[k]; })
      .map(function(k){
        return '<span class="chip" style="background:' + an[k].colour + '"></span>' + an[k].label;
      }).join("");

    var scopeCol = "kpi_in_scope", scope = "";
    if (D.columns.indexOf(scopeCol) !== -1)
      scope = " · " + all.filter(function(r){ return r[scopeCol] === 1; }).length + " in KPI scope";

    drawPager(all.length, pages, from, rows.length);

    $("foot").innerHTML =
      all.length + " mandates" + scope + " · " + cols.length + " columns · Total row uses "
      + aggLabel() + " over all " + all.length + " mandates (AUM itself is summed)"
      + " · source <code>" + D.source + "</code>, built " + D.generated
      + "<br>Analytics shown for " + entry.label + ":" + (chips || " none")
      + ((entry.ov || entry.pick) ? " <em>(per-group override)</em>" : "");

    var names = sortKeys.map(function(k, n){
      var c = null;
      cols.forEach(function(x){ if (x.column === k.col) c = x; });
      var nm = c ? String(c.header == null ? c.column : c.header).split("|").join(" ") : k.col;
      return (sortKeys.length > 1 ? (n + 1) + ". " : "") + nm + " " + (k.dir === 1 ? "▲" : "▼");
    }).join("   ");
    var nManual = Object.keys(manual).length;
    $("hint").innerHTML = "Sorted by " + names
      + "   ·   click a header to sort by it, shift-click to add another column"
      + "   ·   drag a header edge to resize"
      + (nManual ? '   ·   <a id="resetw">reset ' + nManual + ' resized column'
                   + (nManual === 1 ? "" : "s") + "</a>" : "");
    if (nManual){
      $("resetw").addEventListener("click", function(){
        manual = {}; saveWidths(); render();
      });
    }

    var msgs = baseWarn.concat(warn);
    $("warn").textContent = msgs.length ? msgs.join(" · ") : "";

    sizeColumns();   // body is in the DOM: let the browser size it, then pin
  }

  function pageBtn(label, target, opts){
    var b = document.createElement("button");
    b.textContent = label;
    if (opts && opts.cur) b.className = "cur";
    if (opts && opts.disabled) b.disabled = true;
    else b.addEventListener("click", function(){ page = target; sel = null; render(); });
    return b;
  }

  function drawPager(total, pages, from, shown){
    var el = $("pager");
    el.innerHTML = "";
    if (!total) return;

    var left = document.createElement("div");
    left.className = "left";

    var rpp = document.createElement("div");
    rpp.className = "rpp";
    var lab = document.createElement("label");
    lab.setAttribute("for", "pgs");
    lab.textContent = LABEL_ROWS;
    var sel2 = document.createElement("select");
    sel2.id = "pgs";
    TBL.pageSizeOptions.forEach(function(n){
      var o = document.createElement("option");
      o.value = String(n); o.textContent = (n === "all") ? "All" : String(n);
      sel2.appendChild(o);
    });
    sel2.value = String(pageSize);
    sel2.addEventListener("change", function(){
      pageSize = sel2.value === "all" ? "all" : parseInt(sel2.value, 10);
      page = 1; sel = null; render();
    });
    rpp.appendChild(lab); rpp.appendChild(sel2);
    left.appendChild(rpp);

    var info = document.createElement("span");
    info.textContent = "Showing " + (from + 1) + "–" + (from + shown) + " of " + total
                     + " mandate" + (total === 1 ? "" : "s");
    left.appendChild(info);
    el.appendChild(left);

    if (pages <= 1) return;

    var btns = document.createElement("div");
    btns.className = "btns";
    btns.appendChild(pageBtn("‹", page - 1, {disabled: page === 1}));

    var nums = [];
    if (pages <= 7){ for (var i = 1; i <= pages; i++) nums.push(i); }
    else {
      nums.push(1);
      var lo = Math.max(2, page - 1), hi = Math.min(pages - 1, page + 1);
      if (lo > 2) nums.push("…");
      for (var j = lo; j <= hi; j++) nums.push(j);
      if (hi < pages - 1) nums.push("…");
      nums.push(pages);
    }
    nums.forEach(function(n){
      if (n === "…"){
        var g = document.createElement("span"); g.className = "gap"; g.textContent = "…";
        btns.appendChild(g);
      } else btns.appendChild(pageBtn(String(n), n, {cur: n === page}));
    });

    btns.appendChild(pageBtn("›", page + 1, {disabled: page === pages}));
    el.appendChild(btns);
  }

  // Click a header to sort by it alone (clicking the sorted one flips direction).
  // Shift-click builds a multi-column sort: add ▼, shift-click again for ▲,
  // once more to drop that key.
  $("thr").addEventListener("click", function(e){
    if (e.target.classList && e.target.classList.contains("grip")) return;
    var th = e.target.closest("th");
    if (!th || !th.dataset.col) return;
    var col = th.dataset.col, i = keyIndex(col);

    if (e.shiftKey){
      if (i === -1) sortKeys.push({col: col, dir: -1});
      else if (sortKeys[i].dir === -1) sortKeys[i].dir = 1;
      else sortKeys.splice(i, 1);
      if (!sortKeys.length) applyDefaultSort();
    } else {
      if (i !== -1 && sortKeys.length === 1) sortKeys[0].dir = -sortKeys[0].dir;
      else sortKeys = [{col: col, dir: -1}];
    }
    page = 1; sel = null; render();
  });

  $("tbody").addEventListener("click", function(e){
    var td = e.target.closest("td");
    if (!td || !td.dataset.k) return;
    sel = (sel && sel.id === td.dataset.id && sel.k === td.dataset.k)
        ? null : {id: td.dataset.id, k: td.dataset.k};
    render();
  });

  // ---------------------------------------------------------------------
  // Minimal .xlsx reader. An .xlsx is a ZIP of XML; the browser can inflate
  // it with DecompressionStream, so no third-party library is needed.
  // ---------------------------------------------------------------------
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var DATE_FMT_IDS = {14:1,15:1,16:1,17:1,18:1,19:1,20:1,21:1,22:1,45:1,46:1,47:1};

  function utf8(bytes){ return new TextDecoder("utf-8").decode(bytes); }
  function xml(text){
    var doc = new DOMParser().parseFromString(text, "application/xml");
    if (doc.getElementsByTagName("parsererror").length) throw new Error("malformed XML in workbook");
    return doc;
  }

  function readZip(buf){
    var dv = new DataView(buf), u8 = new Uint8Array(buf), eocd = -1;
    var floor = Math.max(0, u8.length - 22 - 65535);
    for (var i = u8.length - 22; i >= floor; i--){
      if (dv.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
    }
    if (eocd < 0) throw new Error("not a valid .xlsx (no ZIP end-of-directory record)");
    var count = dv.getUint16(eocd + 10, true), p = dv.getUint32(eocd + 16, true), entries = {};
    for (var n = 0; n < count && dv.getUint32(p, true) === 0x02014b50; n++){
      var nameLen  = dv.getUint16(p + 28, true),
          extraLen = dv.getUint16(p + 30, true),
          cmtLen   = dv.getUint16(p + 32, true);
      entries[utf8(u8.subarray(p + 46, p + 46 + nameLen))] = {
        method: dv.getUint16(p + 10, true),
        size:   dv.getUint32(p + 20, true),
        lho:    dv.getUint32(p + 42, true)
      };
      p += 46 + nameLen + extraLen + cmtLen;
    }
    return {dv: dv, u8: u8, entries: entries};
  }

  function unzip(zip, name){
    var e = zip.entries[name];
    if (!e) return Promise.reject(new Error('"' + name + '" is missing from the workbook'));
    var nameLen  = zip.dv.getUint16(e.lho + 26, true),
        extraLen = zip.dv.getUint16(e.lho + 28, true),
        start    = e.lho + 30 + nameLen + extraLen;
    var raw = zip.u8.subarray(start, start + e.size);
    if (e.method === 0) return Promise.resolve(utf8(raw));
    if (e.method !== 8) return Promise.reject(new Error("unsupported ZIP compression method " + e.method));
    return new Response(new Blob([raw]).stream().pipeThrough(new DecompressionStream("deflate-raw")))
      .arrayBuffer().then(function(b){ return utf8(new Uint8Array(b)); });
  }

  function textOf(node){
    var t = node.getElementsByTagName("t"), out = "";
    for (var i = 0; i < t.length; i++) out += t[i].textContent;
    return out;
  }

  // Style indices whose number format renders as a date.
  function dateStyles(stylesXml){
    var out = {};
    if (!stylesXml) return out;
    var doc = xml(stylesXml), custom = {};
    var nf = doc.getElementsByTagName("numFmt");
    for (var i = 0; i < nf.length; i++){
      var code = (nf[i].getAttribute("formatCode") || "")
                   .replace(/\[[^\]]*\]/g, "").replace(/"[^"]*"/g, "");
      if (/[ymdhs]/i.test(code)) custom[nf[i].getAttribute("numFmtId")] = 1;
    }
    var xfs = doc.getElementsByTagName("cellXfs")[0];
    if (!xfs) return out;
    var list = xfs.getElementsByTagName("xf");
    for (var j = 0; j < list.length; j++){
      var id = list[j].getAttribute("numFmtId");
      if (DATE_FMT_IDS[+id] || custom[id]) out[j] = 1;
    }
    return out;
  }

  function colIndex(ref){
    var n = 0;
    for (var i = 0; i < ref.length; i++){
      var ch = ref.charCodeAt(i);
      if (ch < 65 || ch > 90) break;
      n = n * 26 + (ch - 64);
    }
    return n - 1;
  }

  // Excel serial day -> ISO date. 25569 = days from 1899-12-30 to 1970-01-01.
  function serialToISO(v){
    return new Date(Math.round((v - 25569) * 86400000)).toISOString().slice(0, 10);
  }

  function cellValue(c, shared, dates){
    var t = c.getAttribute("t");
    if (t === "inlineStr"){
      var is = c.getElementsByTagName("is")[0];
      return is ? textOf(is) : null;
    }
    var v = c.getElementsByTagName("v")[0];
    if (!v) return null;
    var raw = v.textContent;
    if (t === "s")   return shared[+raw] == null ? null : shared[+raw];
    if (t === "str") return raw;
    if (t === "b")   return raw === "1" ? 1 : 0;
    if (t === "e")   return null;
    var num = parseFloat(raw);
    if (isNaN(num)) return null;
    var st = c.getAttribute("s");
    return (st != null && dates[+st]) ? serialToISO(num) : num;
  }

  // Resolve the requested sheet name to its part path inside the archive.
  function sheetPath(zip, wbXml, relsXml, want){
    var sheets = xml(wbXml).getElementsByTagName("sheet"), rid = null, names = [];
    for (var i = 0; i < sheets.length; i++){
      var nm = sheets[i].getAttribute("name");
      names.push(nm);
      if (!want || nm === want){ rid = sheets[i].getAttribute("r:id") ||
                                       sheets[i].getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships", "id");
        if (want) break; }
    }
    if (rid == null)
      throw new Error('sheet "' + want + '" not found — workbook has: ' + names.join(", "));
    var rels = xml(relsXml).getElementsByTagName("Relationship");
    for (var j = 0; j < rels.length; j++){
      if (rels[j].getAttribute("Id") === rid){
        var target = rels[j].getAttribute("Target").replace(/^\/?xl\//, "").replace(/^\//, "");
        return "xl/" + target;
      }
    }
    throw new Error("could not resolve the sheet relationship in the workbook");
  }

  function parseSheet(sheetXml, shared, dates){
    var rows = xml(sheetXml).getElementsByTagName("row"), header = null, out = [];
    for (var r = 0; r < rows.length; r++){
      var cells = rows[r].getElementsByTagName("c"), vals = [];
      for (var c = 0; c < cells.length; c++){
        var ref = cells[c].getAttribute("r");
        vals[ref ? colIndex(ref) : c] = cellValue(cells[c], shared, dates);
      }
      if (!header){
        header = [];
        for (var h = 0; h < vals.length; h++) header.push(vals[h] == null ? "col" + h : String(vals[h]));
        continue;
      }
      var obj = {}, empty = true;
      for (var k = 0; k < header.length; k++){
        var val = vals[k] === undefined ? null : vals[k];
        obj[header[k]] = val;
        if (val !== null && val !== "") empty = false;
      }
      if (!empty) out.push(obj);
    }
    return {columns: header || [], rows: out};
  }

  function monthLabel(iso){
    var p = String(iso).split("-");
    return MONTHS[(+p[1] || 1) - 1] + " " + p[0];
  }
  function groupLabel(g){
    var body = g.indexOf(". ") !== -1 ? g.split(". ").slice(1).join(". ") : g;
    return body.split(" - ").join(" – ");
  }
  function groupSortKey(g){
    var m = /^(\d+)([a-z]?)\./.exec(g);
    return m ? [parseInt(m[1], 10), m[2]] : [99, g];
  }

  function loadWorkbook(url, sheet){
    if (typeof DecompressionStream === "undefined")
      return Promise.reject(new Error("this browser cannot inflate .xlsx (no DecompressionStream)"));
    var stamp = "";
    return fetch(url, {cache: "no-store"})
      .then(function(res){
        if (!res.ok) throw new Error("HTTP " + res.status + " fetching " + url);
        stamp = res.headers.get("last-modified") || "";
        return res.arrayBuffer();
      })
      .then(function(buf){
        var zip = readZip(buf);
        return Promise.all([
          unzip(zip, "xl/workbook.xml"),
          unzip(zip, "xl/_rels/workbook.xml.rels"),
          zip.entries["xl/sharedStrings.xml"] ? unzip(zip, "xl/sharedStrings.xml") : Promise.resolve(null),
          zip.entries["xl/styles.xml"]        ? unzip(zip, "xl/styles.xml")        : Promise.resolve(null)
        ]).then(function(parts){
          var shared = [];
          if (parts[2]){
            var si = xml(parts[2]).getElementsByTagName("si");
            for (var i = 0; i < si.length; i++) shared.push(textOf(si[i]));
          }
          var dates = dateStyles(parts[3]);
          return unzip(zip, sheetPath(zip, parts[0], parts[1], sheet))
            .then(function(sheetXml){ return parseSheet(sheetXml, shared, dates); });
        });
      })
      .then(function(sheetData){
        var name = url.split("/").pop().split("?")[0];
        var d = {
          source: name,
          generated: stamp ? new Date(stamp).toISOString().slice(0, 16).replace("T", " ") : "read from workbook",
          columns: sheetData.columns,
          rows: sheetData.rows,
          months: [], groups: []
        };
        var seenM = {}, seenG = {};
        d.rows.forEach(function(r){
          var m = r[DS.reportDateColumn], g = r[DS.groupColumn];
          if (m != null && !seenM[m]){ seenM[m] = 1; d.months.push({key: String(m), label: monthLabel(m)}); }
          if (g != null && !seenG[g]){ seenG[g] = 1; d.groups.push({key: g, label: groupLabel(g)}); }
        });
        // Newest month first by default — that is usually the one being looked at.
        var asc = ((cfg && cfg.table) || {}).monthOrder === "asc";
        d.months.sort(function(a, b){
          var r = a.key < b.key ? -1 : a.key > b.key ? 1 : 0;
          return asc ? r : -r;
        });
        d.groups.sort(function(a, b){
          var x = groupSortKey(a.key), y = groupSortKey(b.key);
          return x[0] - y[0] || (x[1] < y[1] ? -1 : x[1] > y[1] ? 1 : 0);
        });
        if (!d.rows.length) throw new Error("the sheet has no data rows");
        return d;
      });
  }

  function resolveDataset(){
    var d = cfg.dataset || {};
    DS = {
      reportDateColumn: d.reportDateColumn || "report_date",
      groupColumn:      d.groupColumn      || "exco_view1_level1",
      idColumn:         d.idColumn         || "mandate_id",
      weightColumn:     d.weightColumn     || "aum_usd",
      workbook:         d.workbook         || "data/imm_data.xlsx",
      sheetName:        d.sheetName        || "data"
    };
    // ?data= and ?sheet= override the config, for pointing at another workbook
    // without editing settings.json.
    var q = new URLSearchParams(location.search);
    if (q.get("data"))  DS.workbook  = q.get("data");
    if (q.get("sheet")) DS.sheetName = q.get("sheet");
  }

  // Turn a native <select> into a styled list. The <select> stays in the DOM
  // (hidden) so .value, .options and "change" listeners keep working; this only
  // replaces the popup, which macOS otherwise draws itself and will not pad.
  function enhanceSelect(sel){
    var picker = sel.closest(".picker");
    if (!picker) return;
    picker.classList.add("custom");

    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cs-btn";
    btn.setAttribute("aria-haspopup", "listbox");
    btn.setAttribute("aria-expanded", "false");

    var list = document.createElement("ul");
    list.className = "cs-list";
    list.setAttribute("role", "listbox");
    list.hidden = true;

    var opts = [], active = -1;

    function paint(){
      btn.textContent = sel.selectedOptions.length ? sel.selectedOptions[0].textContent : "";
      opts.forEach(function(li, i){
        li.setAttribute("aria-selected", String(sel.selectedIndex === i));
        li.classList.toggle("active", i === active);
      });
    }
    function open(){
      if (!list.hidden) return;
      active = sel.selectedIndex;
      list.hidden = false;
      btn.setAttribute("aria-expanded", "true");
      paint();
      if (opts[active]) opts[active].scrollIntoView({block: "nearest"});
    }
    function close(){
      list.hidden = true;
      btn.setAttribute("aria-expanded", "false");
    }
    function choose(i){
      if (i < 0 || i >= opts.length) return;
      sel.selectedIndex = i;
      sel.dispatchEvent(new Event("change"));
      paint(); close(); btn.focus();
    }
    function move(delta){
      if (list.hidden){ open(); return; }
      active = Math.max(0, Math.min(opts.length - 1, active + delta));
      paint();
      opts[active].scrollIntoView({block: "nearest"});
    }

    function build(){
      list.innerHTML = ""; opts = [];
      Array.prototype.forEach.call(sel.options, function(o, i){
        var li = document.createElement("li");
        li.className = "cs-opt";
        li.setAttribute("role", "option");
        li.textContent = o.textContent;
        li.addEventListener("click", function(){ choose(i); });
        li.addEventListener("mousemove", function(){ active = i; paint(); });
        list.appendChild(li);
        opts.push(li);
      });
      paint();
    }

    btn.addEventListener("click", function(){ list.hidden ? open() : close(); });
    btn.addEventListener("keydown", function(e){
      if (e.key === "ArrowDown"){ e.preventDefault(); move(1); }
      else if (e.key === "ArrowUp"){ e.preventDefault(); move(-1); }
      else if (e.key === "Home"){ e.preventDefault(); active = 0; paint(); }
      else if (e.key === "End"){ e.preventDefault(); active = opts.length - 1; paint(); }
      else if (e.key === "Enter" || e.key === " "){
        e.preventDefault();
        list.hidden ? open() : choose(active);
      } else if (e.key === "Escape"){ close(); }
    });
    document.addEventListener("click", function(e){
      if (!picker.contains(e.target)) close();
    });

    // Size the control to its widest option so nothing is truncated, closed or open.
    function sizeToWidest(){
      var font = fontOf(btn, 700), w = 0;
      Array.prototype.forEach.call(sel.options, function(o){
        w = Math.max(w, measureText(o.textContent, font));
      });
      // picker padding (12+12) + chevron gutter (20) + borders (2)
      picker.style.width = Math.ceil(w + 46) + "px";
      picker.style.minWidth = "0";
    }

    picker.appendChild(btn);
    picker.appendChild(list);
    build();
    sizeToWidest();
    sel.addEventListener("optionsChanged", sizeToWidest);
    // the select can also change programmatically — keep the label in step
    sel.addEventListener("change", paint);
    sel.addEventListener("optionsChanged", build);
  }

  function start(){
    window.IMM = D;   // parsed workbook, exposed for console inspection
    ["reportDateColumn","groupColumn","idColumn","weightColumn"].forEach(function(k){
      if (D.columns.indexOf(DS[k]) === -1)
        baseWarn.push('dataset.' + k + ' "' + DS[k] + '" is not in ' + D.source);
    });

    var tb = cfg.table || {};
    TBL = {
      aggregation: (tb.aggregation === "avg") ? "avg" : "wavg",
      defaultSort: tb.defaultSort || null,
      pageSize: tb.pageSize == null ? 10 : tb.pageSize,
      pageSizeOptions: isArr(tb.pageSizeOptions) && tb.pageSizeOptions.length
                       ? tb.pageSizeOptions : PAGE_OPTS
    };
    if (tb.aggregation && tb.aggregation !== "avg" && tb.aggregation !== "wavg")
      baseWarn.push('table.aggregation "' + tb.aggregation + '" is not avg or wavg — using wavg');

    IDX = columnIndex();
    groups = normGroups();

    pageSize = TBL.pageSize;
    if (TBL.pageSizeOptions.indexOf(pageSize) === -1)
      TBL.pageSizeOptions = [pageSize].concat(TBL.pageSizeOptions);

    applyDefaultSort();

    var L = cfg.labels || {};
    var capGroup = L.group || "Team";
    document.querySelector('label[for="grp"]').textContent = capGroup;
    document.querySelector('label[for="mth"]').textContent = L.reportMonth || "Report Month";
    LABEL_ROWS = L.rowsPerPage || "Rows per page";

    var grpEl = $("grp"), mthEl = $("mth");
    groups.forEach(function(g){
      var o = document.createElement("option"); o.value = g.key; o.textContent = g.label;
      grpEl.appendChild(o);
    });
    D.months.forEach(function(m){
      var o = document.createElement("option"); o.value = m.key; o.textContent = m.label;
      mthEl.appendChild(o);
    });

    var dg = cfg.defaultGroup, dm = cfg.defaultReportMonth;
    grpEl.value = (dg && groups.some(function(g){ return g.key === dg; })) ? dg : groups[0].key;

    // defaultReportMonth accepts "latest" (the default), "earliest", or an
    // explicit key. Resolved from the data, not from the picker's sort order.
    var keys = D.months.map(function(m){ return m.key; }).slice().sort();
    var wanted;
    if (dm == null || dm === "latest")   wanted = keys[keys.length - 1];
    else if (dm === "earliest")          wanted = keys[0];
    else if (keys.indexOf(dm) !== -1)    wanted = dm;
    else {
      baseWarn.push('defaultReportMonth "' + dm + '" is not a report date in ' + D.source
                    + " — using the latest");
      wanted = keys[keys.length - 1];
    }
    mthEl.value = wanted;

    enhanceSelect(grpEl);
    enhanceSelect(mthEl);

    grpEl.addEventListener("change", function(){ sel = null; page = 1; render(); });
    mthEl.addEventListener("change", function(){ sel = null; page = 1; render(); });
    render();
  }

  // Load every mapping workbook referenced by a `total: "band"` column.
  function loadBandTables(){
    var specs = (cfg.columns || []).filter(function(c){
      return c && c.total === "band" && c.band && c.band.workbook;
    });
    if (!specs.length) return Promise.resolve();

    return Promise.all(specs.map(function(c){
      var b = c.band;
      return loadWorkbook(b.workbook, b.sheet || "data").then(function(m){
        var need = [b.label, b.value, b.min, b.max];
        var missing = need.filter(function(n){ return m.columns.indexOf(n) === -1; });
        if (missing.length){
          baseWarn.push('band mapping for "' + c.column + '" has no column '
                        + missing.join(", ") + " in " + b.workbook);
          return;
        }
        var exclude = {};
        (b.exclude || []).forEach(function(x){ exclude[String(x)] = 1; });

        var list = [], byLabel = {};
        m.rows.forEach(function(r){
          if (r[b.label] == null || r[b.value] == null) return;
          var e = {label: String(r[b.label]), value: +r[b.value],
                   min: +r[b.min], max: +r[b.max], excluded: !!exclude[String(r[b.label])]};
          list.push(e);
          if (!byLabel[e.label]) byLabel[e.label] = e;   // first row wins on duplicates
        });
        if (!list.length){
          baseWarn.push('band mapping for "' + c.column + '" is empty');
          return;
        }
        BANDS[c.column] = {rows: list, byLabel: byLabel, source: m.source};
      }).catch(function(err){
        baseWarn.push('band mapping for "' + c.column + '" could not be read ('
                      + err.message + ") — the Total cell will be blank");
      });
    }));
  }

  function fail(msg){
    $("warn").textContent = msg;
    $("tbody").innerHTML = '<tr><td class="empty">Could not load the data.</td></tr>';
    $("pager").innerHTML = ""; $("hint").textContent = "";
  }

  fetch("config/settings.json", {cache: "no-store"})
    .then(function(res){ if (!res.ok) throw new Error("HTTP " + res.status); return res.json(); })
    .then(function(json){ cfg = json; })
    .catch(function(err){
      cfg = FALLBACK;
      baseWarn.push("config/settings.json could not be loaded (" + err.message
                    + ") — using built-in defaults; serve this folder over http to enable it");
    })
    .then(function(){
      resolveDataset();
      return loadWorkbook(DS.workbook, DS.sheetName);
    })
    .then(function(data){ D = data; return loadBandTables(); })
    .then(function(){ start(); })
    .catch(function(err){
      fail("Could not read " + DS.workbook + " — " + err.message
           + ". The workbook must be reachable over http from this page;"
           + ' set dataset.workbook in settings.json, or pass ?data=<url>.');
    });
})();
</script>
</body>
</html>
